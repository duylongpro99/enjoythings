[project]
name = "fastapi-chat-stream"
version = "0.1.0"
description = "Minimal FastAPI chat streaming server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiokafka[snappy]>=0.12,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.111.0,<1.0.0",
  "grpcio>=1.81.0",
  "httpx>=0.27.0,<1.0.0",
  "langgraph>=1.2.4",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-instrumentation-grpc>=0.60b0,<1",
  "opentelemetry-instrumentation-httpx>=0.60b0,<1",
  "opentelemetry-sdk>=1.39,<2",
  "prometheus-client>=0.22,<1",
  "protobuf>=6.33.5,<7.0.0",
  "python-dotenv>=1.2.2",
  "uvicorn>=0.30.0,<1.0.0",
]

[project.scripts]
fraud-migrate = "app.fraud.repo.migrate:main"
fraud-worker = "app.fraud.main:main"

[dependency-groups]
dev = [
  "grpcio-tools>=1.81.0",
  "mypy>=2.3.1",
  "pytest>=8.2.0",
  "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Generated protobuf clients are checked in as produced by grpcio-tools.
extend-exclude = ["app/fraud/integrations/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# No formatter is enforced on this repository, so line length stays advisory.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
# Generated protobuf clients carry their own loose typing.
exclude = "app/fraud/integrations/gen"

[[tool.mypy.overrides]]
module = "app.fraud.integrations.gen.*"
follow_imports = "skip"
ignore_errors = true
