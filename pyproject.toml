[project]
name = "fastapi-chat-stream"
version = "0.1.0"
description = "Minimal FastAPI chat streaming server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0,<1.0.0",
  "grpcio>=1.81.0",
  "httpx>=0.27.0,<1.0.0",
  "protobuf>=6.33.5,<7.0.0",
  "python-dotenv>=1.2.2",
  "uvicorn>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
  "grpcio-tools>=1.81.0",
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
