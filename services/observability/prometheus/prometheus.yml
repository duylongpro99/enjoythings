global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: go-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - wallet:8080
          - ledger:8080
          - saga-orchestrator:8080
          - payment-processor:8080
          - verification:8080
          - notification:8080
  - job_name: fraud-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - fraud-worker:9101
