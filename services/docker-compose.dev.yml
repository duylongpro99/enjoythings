services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enjoythings
      POSTGRES_USER: enjoythings
      POSTGRES_PASSWORD: enjoythings_dev_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enjoythings -d enjoythings"]
      interval: 5s
      timeout: 5s
      retries: 10
