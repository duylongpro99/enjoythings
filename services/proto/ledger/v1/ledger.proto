syntax = "proto3";

package ledger.v1;

import "google/protobuf/timestamp.proto";

option go_package = "enjoythings/services/gen/ledger/v1;ledgerv1";

// LedgerService exposes ledger entries for wallets.
//
// Expected gRPC status mapping:
// - INVALID_ARGUMENT for malformed input.
// - NOT_FOUND for missing wallets.
// - INTERNAL for unexpected persistence or infrastructure errors.
service LedgerService {
  rpc GetEntries(GetEntriesRequest) returns (GetEntriesResponse);
  rpc GetFraudTransactionHistory(GetFraudTransactionHistoryRequest) returns (GetFraudTransactionHistoryResponse);
  rpc GetFraudVelocityMetrics(GetFraudVelocityMetricsRequest) returns (GetFraudVelocityMetricsResponse);
  rpc ReserveTransfer(ReserveTransferRequest) returns (ReserveTransferResponse);
  rpc ConfirmTransfer(ConfirmTransferRequest) returns (ConfirmTransferResponse);
  rpc CancelReservation(CancelReservationRequest) returns (CancelReservationResponse);
}

message GetEntriesRequest {
  string wallet_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message GetEntriesResponse {
  string wallet_id = 1;
  repeated LedgerEntry entries = 2;
  string next_cursor = 3;
}

message LedgerEntry {
  string id = 1;
  string transfer_id = 2;
  string direction = 3;
  int64 amount_cents = 4;
  int64 balance_after_cents = 5;
  google.protobuf.Timestamp created_at = 6;
}

message GetFraudTransactionHistoryRequest {
  string wallet_id = 1;
  int32 limit = 2;
  string trace_id = 3;
}

message GetFraudTransactionHistoryResponse {
  repeated FraudTransactionHistoryEntry entries = 1;
}

message FraudTransactionHistoryEntry {
  string direction = 1;
  int64 amount_cents = 2;
  string currency = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message GetFraudVelocityMetricsRequest {
  string wallet_id = 1;
  string trace_id = 2;
}

message GetFraudVelocityMetricsResponse {
  int32 transactions_last_hour = 1;
  int64 amount_last_hour_cents = 2;
  int64 average_amount_30d_cents = 3;
  int32 distinct_recipients_30d = 4;
}

message ReserveTransferRequest {
  string payment_id = 1;
  string idempotency_key = 2;
  string trace_id = 3;
  string from_wallet_id = 4;
  string to_wallet_id = 5;
  int64 amount_cents = 6;
  string currency = 7;
}

message ReserveTransferResponse {
  string payment_id = 1;
  string ledger_reservation_id = 2;
  string status = 3;
}

message ConfirmTransferRequest {
  string payment_id = 1;
  string idempotency_key = 2;
  string trace_id = 3;
  string ledger_reservation_id = 4;
  string wallet_debit_id = 5;
}

message ConfirmTransferResponse {
  string payment_id = 1;
  string transfer_id = 2;
  string status = 3;
  google.protobuf.Timestamp completed_at = 4;
}

message CancelReservationRequest {
  string payment_id = 1;
  string idempotency_key = 2;
  string trace_id = 3;
  string ledger_reservation_id = 4;
  string reason = 5;
}

message CancelReservationResponse {
  string payment_id = 1;
  string ledger_reservation_id = 2;
  string status = 3;
}
