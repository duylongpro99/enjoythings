syntax = "proto3";

package wallet.v1;

import "google/protobuf/timestamp.proto";

option go_package = "enjoythings/services/gen/wallet/v1;walletv1";

// WalletService owns wallet creation, balance reads, and transfer initiation.
//
// Expected gRPC status mapping:
// - INVALID_ARGUMENT for malformed input.
// - NOT_FOUND for missing wallets.
// - FAILED_PRECONDITION for insufficient funds.
// - INTERNAL for unexpected persistence or infrastructure errors.
service WalletService {
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc InitiateTransfer(InitiateTransferRequest) returns (InitiateTransferResponse);
  rpc DebitForSaga(DebitForSagaRequest) returns (DebitForSagaResponse);
  rpc CompensateDebit(CompensateDebitRequest) returns (CompensateDebitResponse);
}

message CreateWalletRequest {
  string user_id = 1;
  string currency = 2;
}

message CreateWalletResponse {
  Wallet wallet = 1;
}

message GetWalletRequest {
  string wallet_id = 1;
}

message GetWalletResponse {
  Wallet wallet = 1;
}

message GetBalanceRequest {
  string wallet_id = 1;
}

message GetBalanceResponse {
  string wallet_id = 1;
  int64 balance_cents = 2;
  string currency = 3;
}

message InitiateTransferRequest {
  string from_wallet_id = 1;
  string to_wallet_id = 2;
  int64 amount_cents = 3;
}

message InitiateTransferResponse {
  string transfer_id = 1;
  string status = 2;
  BalanceChange balances = 3;
}

message Wallet {
  string id = 1;
  string user_id = 2;
  int64 balance_cents = 3;
  string currency = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message BalanceChange {
  int64 from_balance_cents = 1;
  int64 to_balance_cents = 2;
}

message DebitForSagaRequest {
  string payment_id = 1;
  string idempotency_key = 2;
  string trace_id = 3;
  string from_wallet_id = 4;
  int64 amount_cents = 5;
  string currency = 6;
  string ledger_reservation_id = 7;
}

message DebitForSagaResponse {
  string payment_id = 1;
  string wallet_debit_id = 2;
  string status = 3;
  int64 balance_after_cents = 4;
}

message CompensateDebitRequest {
  string payment_id = 1;
  string idempotency_key = 2;
  string trace_id = 3;
  string from_wallet_id = 4;
  string wallet_debit_id = 5;
  int64 amount_cents = 6;
  string currency = 7;
  string reason = 8;
}

message CompensateDebitResponse {
  string payment_id = 1;
  string compensation_id = 2;
  string status = 3;
  int64 balance_after_cents = 4;
}
