# Produces the application Secret from Vault. Same name, namespace and six keys
# as services/charts/enjoythings/templates/secret.yaml renders when
# secrets.create is true.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: enjoythings-secret
  namespace: enjoythings
spec:
  # How often ESO re-reads Vault and rewrites the Secret if anything changed.
  # 30s is short so the rotation exercise is quick to watch. 1h is a common
  # production value.
  refreshInterval: 30s
  secretStoreRef:
    kind: SecretStore
    name: vault-dev
  target:
    name: enjoythings-secret
    # Owner: ESO creates the Secret, sets an ownerReference on it, recreates it
    # if deleted, and deletes it when this ExternalSecret is deleted.
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Merge: keep every key pulled by dataFrom below AND add the templated
      # ones. The default, Replace, would keep only the templated keys.
      mergePolicy: Merge
      type: Opaque
      data:
        # Built from the passwords, so the URL and the raw password always
        # agree. {{ .POSTGRES_PASSWORD }} refers to the field fetched below.
        DATABASE_URL: "postgres://enjoythings:{{ .POSTGRES_PASSWORD }}@postgres:5432/enjoythings?sslmode=disable"
        FRAUD_DATABASE_URL: "postgres://fraud_worker:{{ .FRAUD_POSTGRES_PASSWORD }}@fraud-timescaledb:5432/fraud_audit?sslmode=disable"
  dataFrom:
    # Pull every field of secret/enjoythings (KV v2 path secret/data/enjoythings)
    # into the Secret under the same key names: JWT_SECRET, POSTGRES_PASSWORD,
    # FRAUD_POSTGRES_PASSWORD, LOCAL_LLM_API_KEY.
    - extract:
        key: enjoythings
