# The credential ESO presents to Vault. In dev mode this is the root token from
# vault-values.yaml, which is well known and not a secret, so this file is safe
# to commit. With a real Vault you would not use a token at all; see the
# Kubernetes auth notes in docs/secrets-management-runbook.md section 14.
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: enjoythings
type: Opaque
stringData:
  token: root
