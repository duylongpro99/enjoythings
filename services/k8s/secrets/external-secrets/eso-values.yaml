# Helm values for External Secrets Operator.
#
# Install:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     --version 2.10.0 --namespace external-secrets --create-namespace \
#     -f eso-values.yaml --wait
#
# The defaults are already right for a single-node cluster. The values below
# only make the choices explicit.

# Install the CRDs (ExternalSecret, SecretStore, ...) with the chart. Without
# them, applying externalsecret.yaml fails with "no matches for kind".
installCRDs: true

# One controller replica. The webhook and cert-controller Deployments the chart
# also creates validate resources and manage the webhook certificate.
replicaCount: 1
