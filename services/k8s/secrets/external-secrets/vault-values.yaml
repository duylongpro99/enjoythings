# Helm values for HashiCorp Vault in dev mode, used only as a local backend for
# External Secrets Operator (docs/secrets-management-runbook.md section 6).
#
# Install:
#   helm repo add hashicorp https://helm.releases.hashicorp.com
#   helm install vault hashicorp/vault --version 0.34.1 \
#     --namespace vault --create-namespace -f vault-values.yaml --wait
#
# Dev mode: a single server, in-memory storage, auto-initialized and unsealed,
# plain HTTP on 8200, a KV v2 engine already mounted at secret/, and a root
# token you choose. Every restart of the pod wipes every secret. Never use dev
# mode for anything real.
server:
  dev:
    enabled: true
    # Becomes VAULT_DEV_ROOT_TOKEN_ID. Well known and intentionally not secret.
    devRootToken: root
  # Dev mode keeps everything in memory, so no PersistentVolumeClaim is needed.
  dataStorage:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# The agent injector mutates pods to add Vault sidecars. ESO does not need it.
injector:
  enabled: false

# The UI is a second way to look at secrets. Not needed; the CLI in the pod is
# enough, and one fewer Service keeps the demo small.
ui:
  enabled: false
