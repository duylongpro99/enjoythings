# How ESO reaches Vault. A SecretStore is namespaced: only ExternalSecrets in
# the same namespace may use it. A ClusterSecretStore would be shared.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-dev
  namespace: enjoythings
spec:
  provider:
    vault:
      # Service "vault" in namespace "vault", created by the Helm release.
      # Plain HTTP because dev mode has no TLS.
      server: http://vault.vault.svc.cluster.local:8200
      # Mount path of the KV engine. Dev mode mounts KV v2 at secret/.
      path: secret
      version: v2
      auth:
        # Token auth: the simplest method that works in dev mode. ESO reads the
        # token from the Secret in vault-token-secret.yaml.
        tokenSecretRef:
          name: vault-token
          key: token
