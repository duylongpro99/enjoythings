# Example Helm values file for the SOPS workflow. Copy to values-secrets.yaml
# (git-ignored by the repository .gitignore), fill in real values, then run
# `sops encrypt values-secrets.yaml > values-secrets.enc.yaml`. Only the
# encrypted file is committed.
#
# With SOPS the chart renders its own Secret, so secrets.create stays true.
# The database passwords appear twice and must agree: the container reads
# postgres.password, the services read secrets.databaseUrl.
postgres:
  password: REPLACE_ME_PG_PASSWORD
fraudTimescaledb:
  password: REPLACE_ME_FRAUD_PASSWORD
secrets:
  create: true
  jwtSecret: REPLACE_ME_JWT_SECRET
  databaseUrl: postgres://enjoythings:REPLACE_ME_PG_PASSWORD@postgres:5432/enjoythings?sslmode=disable
  fraudDatabaseUrl: postgres://fraud_worker:REPLACE_ME_FRAUD_PASSWORD@fraud-timescaledb:5432/fraud_audit?sslmode=disable
  localLLMApiKey: REPLACE_ME_LLM_API_KEY
