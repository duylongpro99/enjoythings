# sops configuration. sops looks for the nearest .sops.yaml when it encrypts a
# file, so run sops commands from this directory or point at files under it.
#
# Replace the age recipient below with YOUR public key, printed by
# ./setup-age-key.sh. A public key is safe to commit. The matching private key
# stays in ~/Library/Application Support/sops/age/keys.txt (macOS) or
# ~/.config/sops/age/keys.txt (Linux) and is never committed.
creation_rules:
  # Matches values-secrets.yaml (the plain input) and values-secrets.enc.yaml
  # (the encrypted output). sops picks the rule by the path of the file it is
  # given, which for `sops encrypt in > out` is the input path.
  - path_regex: values-secrets.*\.yaml$
    age: age10fv87ew8gtwqse4p8mcqqxmyhrpalxx3zpajtp9vcdxzd30sxcvq5kkhgh
    # Encrypt only the leaf keys that hold credentials. The rest of the values
    # file stays readable so git diffs still show structure.
    encrypted_regex: ^(password|jwtSecret|databaseUrl|fraudDatabaseUrl|localLLMApiKey)$
