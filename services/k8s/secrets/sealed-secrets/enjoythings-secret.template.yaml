# Plain-text template of the application Secret. NEVER apply or commit this
# with real values. seal.sh fills the REPLACE_ME_* placeholders from your shell,
# pipes the result through kubeseal, and writes only the encrypted SealedSecret
# to manifests/enjoythings-sealedsecret.yaml.
#
# Contract (services/charts/enjoythings/templates/secret.yaml): the name, the
# namespace and these six keys are what every Deployment reads via envFrom.
# Each database password appears twice, raw and inside its connection URL, and
# the two copies must agree. seal.sh substitutes one variable into both places
# so they cannot drift.
apiVersion: v1
kind: Secret
metadata:
  name: enjoythings-secret
  namespace: enjoythings
type: Opaque
stringData:
  JWT_SECRET: REPLACE_ME_JWT_SECRET
  POSTGRES_PASSWORD: REPLACE_ME_PG_PASSWORD
  FRAUD_POSTGRES_PASSWORD: REPLACE_ME_FRAUD_PASSWORD
  DATABASE_URL: postgres://enjoythings:REPLACE_ME_PG_PASSWORD@postgres:5432/enjoythings?sslmode=disable
  FRAUD_DATABASE_URL: postgres://fraud_worker:REPLACE_ME_FRAUD_PASSWORD@fraud-timescaledb:5432/fraud_audit?sslmode=disable
  LOCAL_LLM_API_KEY: REPLACE_ME_LLM_API_KEY
