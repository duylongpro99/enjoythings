# Helm values for the Sealed Secrets controller.
#
# Install (docs/secrets-management-runbook.md section 4):
#   helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
#   helm install sealed-secrets sealed-secrets/sealed-secrets \
#     --version 2.19.3 --namespace kube-system -f values.yaml --wait
#
# The chart names the controller after the release ("sealed-secrets"), but the
# kubeseal CLI looks for "sealed-secrets-controller" in kube-system by default.
# Overriding the name here means every kubeseal command in the runbook works
# without extra flags.
fullnameOverride: sealed-secrets-controller
