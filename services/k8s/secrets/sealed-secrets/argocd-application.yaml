# Second Argo CD Application: syncs the SealedSecret in ./manifests into the
# enjoythings namespace. Kept separate from services/k8s/argocd/application.yaml
# so the chart Application stays unchanged and keeps secrets.create=false.
#
# Apply once with `kubectl apply -f argocd-application.yaml` after the
# SealedSecret has been committed and pushed to the branch below. Argo CD reads
# git, never your working tree.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enjoythings-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/duylongpro99/enjoythings.git
    targetRevision: master
    path: services/k8s/secrets/sealed-secrets/manifests
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: enjoythings
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
