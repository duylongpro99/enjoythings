# staging overlay: same base as dev, different branch, namespace and Helm
# parameters. Build it with `kustomize build services/k8s/kustomize/overlays/staging`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

nameSuffix: -staging

labels:
  - pairs:
      enjoythings.io/environment: staging
    includeSelectors: false

patches:
  - path: patch-source.yaml
  - path: patch-helm-parameters.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: enjoythings
