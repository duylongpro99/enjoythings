# Alternative to podmonitor-enjoythings.yaml: scrape any pod in the cluster
# that carries the prometheus.io/scrape, prometheus.io/path and
# prometheus.io/port annotations the EnjoyThings chart sets on every pod.
#
# Add this file AFTER kube-prometheus-stack-values.yaml on the helm command:
#
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --version 90.0.0 -n monitoring \
#     -f services/k8s/observability/kube-prometheus-stack-values.yaml \
#     -f services/k8s/observability/kube-prometheus-stack-values.annotations.yaml
#
# The chart stores the list below in a Secret and mounts it into Prometheus as
# additional scrape configuration. Use either this file or the PodMonitor, not
# both, or every series is scraped twice under two job names.
#
# Known effect: stub-payment-rail is annotated but has no /metrics handler, so
# its target shows as DOWN. The PodMonitor excludes it explicitly.
prometheus:
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: annotated-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - enjoythings
        relabel_configs:
          # Keep only pods that opted in.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Honor prometheus.io/path, default /metrics.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Honor prometheus.io/port: rewrite the address to <pod ip>:<port>.
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Only the first container port is discovered per pod once the
          # address is rewritten; drop duplicates created by extra ports.
          - source_labels: [__meta_kubernetes_pod_container_port_number, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: keep
            regex: (\d+);\1
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: app
