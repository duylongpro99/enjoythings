# Values for grafana/alloy 1.12.1 (Alloy v1.19), release name `alloy`,
# namespace `monitoring`. One Alloy pod per node tails the logs of every pod
# on that node through the Kubernetes API and pushes them to Loki.
#
#   helm upgrade --install alloy grafana/alloy --version 1.12.1 -n monitoring \
#     -f services/k8s/observability/alloy-values.yaml

controller:
  type: daemonset

alloy:
  # Exposes the node name so each Alloy only tails pods on its own node.
  # Without this filter every Alloy would ship every pod's logs and a
  # multi-node cluster would store each line once per node.
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  configMap:
    create: true
    content: |
      // 1. Find pods. Only the ones scheduled on this node.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // 2. Turn Kubernetes metadata into Loki labels. Keep the label set small:
      //    every distinct label combination is a separate stream in Loki.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // The EnjoyThings chart labels every pod with its component name
        // (gateway, saga-orchestrator, fraud-worker, ...). Expose it as `app`.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      // 3. Tail the container logs through the kubelet API. No hostPath mounts
      //    are needed, which is why this is simpler than the classic
      //    /var/log/pods file tailer.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      // 4. Push to Loki. The service name comes from the loki release with the
      //    gateway disabled (loki-values.yaml).
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
