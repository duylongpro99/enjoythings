services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enjoythings
      POSTGRES_USER: enjoythings
      POSTGRES_PASSWORD: enjoythings_dev_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enjoythings -d enjoythings"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tx.initiated --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.execute --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.completed --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.failed --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tx.completed --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tx.failed --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tx.paused --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud.score.requested --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud.flagged --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud.error --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic user.verified --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic user.rejected --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tx.initiated.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.completed.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment.failed.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud.flagged.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud.score.requested.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tx.completed.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tx.failed.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tx.paused.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic user.verified.dlq --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic user.rejected.dlq --partitions 1 --replication-factor 1

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_HTTP_PORT:-4318}:4318"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      JWT_SECRET: local-dev-jwt-secret-change-me
      WALLET_GRPC_ADDR: wallet:9090
      LEDGER_GRPC_ADDR: ledger:9091
      SAGA_GRPC_ADDR: saga-orchestrator:9093
      VERIFICATION_GRPC_ADDR: verification:9094
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      RATE_LIMIT_BURST: "600"
      RATE_LIMIT_REFILL_EVERY: 1s
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      wallet:
        condition: service_healthy
      ledger:
        condition: service_healthy
      saga-orchestrator:
        condition: service_healthy
      verification:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null && wget -q -O- http://localhost:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  wallet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: wallet
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
      DATABASE_URL: postgres://enjoythings:enjoythings_dev_password@postgres:5432/enjoythings?sslmode=disable
      DB_MAX_CONNS: "10"
      KAFKA_BROKERS: kafka:9092
      WALLET_OUTBOX_TOPIC: tx.initiated
      WALLET_OUTBOX_POLL_INTERVAL: 100ms
      WALLET_OUTBOX_BATCH_SIZE: "100"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${WALLET_HTTP_PORT:-8081}:8080"
      - "${WALLET_GRPC_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null && wget -q -O- http://localhost:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  ledger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ledger
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      GRPC_ADDR: :9091
      DATABASE_URL: postgres://enjoythings:enjoythings_dev_password@postgres:5432/enjoythings?sslmode=disable
      DB_MAX_CONNS: "10"
      KAFKA_BROKERS: kafka:9092
      LEDGER_CONSUMER_ENABLED: "true"
      LEDGER_CONSUMER_TOPIC: tx.initiated
      LEDGER_CONSUMER_GROUP_ID: ledger-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${LEDGER_HTTP_PORT:-8082}:8080"
      - "${LEDGER_GRPC_PORT:-9091}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null && wget -q -O- http://localhost:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  saga-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: saga-orchestrator
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      GRPC_ADDR: :9093
      DATABASE_URL: postgres://enjoythings:enjoythings_dev_password@postgres:5432/enjoythings?sslmode=disable
      DB_MAX_CONNS: "10"
      KAFKA_BROKERS: kafka:9092
      WALLET_GRPC_ADDR: wallet:9090
      LEDGER_GRPC_ADDR: ledger:9091
      VERIFICATION_GRPC_ADDR: verification:9094
      SAGA_CONSUMER_ENABLED: "true"
      SAGA_CONSUMER_GROUP_ID: saga-orchestrator
      SAGA_OUTBOX_POLL_INTERVAL: 100ms
      SAGA_OUTBOX_BATCH_SIZE: "100"
      SAGA_FRAUD_REVIEW_TTL: "${SAGA_FRAUD_REVIEW_TTL:-}"
      SAGA_FRAUD_REVIEW_REAPER_INTERVAL: 1m
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${SAGA_HTTP_PORT:-8084}:8080"
      - "${SAGA_GRPC_PORT:-9093}:9093"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      wallet:
        condition: service_healthy
      ledger:
        condition: service_healthy
      verification:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null && wget -q -O- http://localhost:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  stub-payment-rail:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: stub-payment-rail
    environment:
      HTTP_ADDR: :18090
      STUB_RAIL_TIMEOUT_SLEEP: 3s
    ports:
      - "${STUB_PAYMENT_RAIL_PORT:-18090}:18090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --post-data='{\"payment_id\":\"health-success\",\"idempotency_key\":\"health\",\"amount_cents\":1,\"currency\":\"USD\"}' --header='Content-Type: application/json' http://localhost:18090/charge >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  payment-processor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment-processor
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://enjoythings:enjoythings_dev_password@postgres:5432/enjoythings?sslmode=disable
      DB_MAX_CONNS: "10"
      KAFKA_BROKERS: kafka:9092
      PAYMENT_PROCESSOR_CONSUMER_GROUP: payment-processor
      PAYMENT_RAIL_URL: http://stub-payment-rail:18090
      PAYMENT_RAIL_TIMEOUT: 2s
      PAYMENT_PROCESSOR_OUTBOX_INTERVAL: 100ms
      PAYMENT_PROCESSOR_OUTBOX_BATCH_SIZE: "100"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${PAYMENT_PROCESSOR_HTTP_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      stub-payment-rail:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null && wget -q -O- http://localhost:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  verification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: verification
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      GRPC_ADDR: :9094
      DATABASE_URL: postgres://enjoythings:enjoythings_dev_password@postgres:5432/enjoythings?sslmode=disable
      DB_MAX_CONNS: "10"
      KAFKA_BROKERS: kafka:9092
      VERIFICATION_MODE: auto
      VERIFICATION_OUTBOX_INTERVAL: 100ms
      VERIFICATION_OUTBOX_BATCH_SIZE: "100"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${VERIFICATION_HTTP_PORT:-8086}:8080"
      - "${VERIFICATION_GRPC_PORT:-9094}:9094"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null && wget -q -O- http://localhost:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification
    environment:
      APP_ENV: local
      HTTP_ADDR: :8080
      KAFKA_BROKERS: kafka:9092
      NOTIFICATION_CONSUMER_GROUP: notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${NOTIFICATION_HTTP_PORT:-8087}:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz >/dev/null && wget -q -O- http://localhost:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  fraud-timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${FRAUD_DB_NAME}
      POSTGRES_USER: ${FRAUD_DB_USER}
      POSTGRES_PASSWORD: ${FRAUD_DB_PASSWORD}
    volumes:
      - fraud-timescaledb-data:/var/lib/postgresql/data
    ports:
      - "${FRAUD_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FRAUD_DB_USER} -d ${FRAUD_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  fraud-worker:
    build:
      context: ..
      dockerfile: app/fraud/Dockerfile
    environment:
      FRAUD_DATABASE_URL: postgres://${FRAUD_DB_USER}:${FRAUD_DB_PASSWORD}@fraud-timescaledb:5432/${FRAUD_DB_NAME}
      FRAUD_METRICS_PORT: "9101"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGER_GRPC_ADDR: ledger:9091
      VERIFICATION_GRPC_ADDR: verification:9094
      LLM_PROVIDERS_JSON: ${LLM_PROVIDERS_JSON}
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "${FRAUD_METRICS_PORT:-9101}:9101"
    depends_on:
      fraud-timescaledb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      ledger:
        condition: service_healthy
      verification:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics')\""]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"
    depends_on:
      gateway:
        condition: service_healthy
      wallet:
        condition: service_healthy
      ledger:
        condition: service_healthy
      saga-orchestrator:
        condition: service_healthy
      payment-processor:
        condition: service_healthy
      verification:
        condition: service_healthy
      notification:
        condition: service_healthy
      fraud-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fraud-timescaledb-data:
  prometheus-data:
  grafana-data:
