root = "."
tmp_dir = "tmp"

[build]
cmd = "${DEV_CMD}"
bin = "tmp/dev-service"
delay = 1000
exclude_dir = ["tmp", "vendor"]
include_dir = ["cmd", "internal", "db"]
include_ext = ["go", "sql", "yaml", "yml", "toml"]
kill_delay = "500ms"
log = "tmp/air-build.log"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
