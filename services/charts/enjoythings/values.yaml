global:
  appEnv: local
  imagePullPolicy: IfNotPresent

postgres:
  enabled: true
  image: postgres:16-alpine
  database: enjoythings
  user: enjoythings
  password: enjoythings_dev_password
  service:
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kafka:
  enabled: true
  image: apache/kafka:3.9.0
  service:
    port: 9092
  topics:
    - tx.initiated
    - payment.execute
    - payment.completed
    - payment.failed
    - tx.completed
    - tx.failed
    - user.verified
    - user.rejected
    - fraud.score.requested
    - fraud.flagged
    - fraud.error
    - tx.initiated.dlq
    - payment.completed.dlq
    - payment.failed.dlq
    - fraud.flagged.dlq
    - fraud.score.requested.dlq
    - tx.completed.dlq
    - tx.failed.dlq
    - tx.paused.dlq
    - user.verified.dlq
    - user.rejected.dlq

fraudTimescaledb:
  enabled: true
  image: timescale/timescaledb:2.17.2-pg16
  database: fraud_audit
  user: fraud_worker
  password: local-fraud-password
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

secrets:
  jwtSecret: local-dev-jwt-secret-change-me
  databaseUrl: postgres://enjoythings:enjoythings_dev_password@postgres:5432/enjoythings?sslmode=disable
  fraudDatabaseUrl: postgres://fraud_worker:local-fraud-password@fraud-timescaledb:5432/fraud_audit?sslmode=disable
  localLLMApiKey: local-development-key

config:
  dbMaxConns: "10"
  kafkaBrokers: kafka:9092
  walletGrpcAddr: wallet:9090
  ledgerGrpcAddr: ledger:9091
  sagaGrpcAddr: saga-orchestrator:9093
  verificationGrpcAddr: verification:9094
  rateLimitBurst: "600"
  rateLimitRefillEvery: 1s
  walletOutboxTopic: tx.initiated
  walletOutboxPollInterval: 100ms
  walletOutboxBatchSize: "100"
  ledgerConsumerEnabled: "true"
  ledgerConsumerTopic: tx.initiated
  ledgerConsumerGroupId: ledger-service
  sagaConsumerEnabled: "true"
  sagaConsumerGroupId: saga-orchestrator
  sagaOutboxPollInterval: 100ms
  sagaOutboxBatchSize: "100"
  # Empty keeps fraud reviews open until an operator decides them; a duration
  # such as 24h auto-rejects older reviews.
  sagaFraudReviewTtl: ""
  sagaFraudReviewReaperInterval: 1m
  paymentProcessorConsumerGroup: payment-processor
  paymentRailUrl: http://stub-payment-rail:18090
  paymentRailTimeout: 2s
  paymentProcessorOutboxInterval: 100ms
  paymentProcessorOutboxBatchSize: "100"
  verificationMode: auto
  verificationOutboxInterval: 100ms
  verificationOutboxBatchSize: "100"
  notificationConsumerGroup: notification-service
  stubRailTimeoutSleep: 3s
  llmProvidersJson: '{"providers":[{"id":"local","driver_type":"openai_compatible","base_url":"http://host.docker.internal:11434/v1","api_key_env":"LOCAL_LLM_API_KEY","model":"llama3.1","timeout_seconds":30}]}'
  llmDefaultProvider: local

# Internal-gRPC mutual TLS. Off by default: the services run insecure, exactly
# as before. When enabled, every gRPC server and client mounts `secretName` at
# `mountPath` and is pointed at its own leaf certificate plus the shared CA. The
# secret is created out of band (see services/k8s/kind/README or the design
# note) and must hold ca.crt and a <service>.crt / <service>.key for each of the
# servers plus the clients listed below.
mtls:
  enabled: false
  secretName: enjoythings-mtls
  mountPath: /certs
  # gRPC clients that have no gRPC server port of their own but still need an
  # identity to dial with. Servers are detected automatically by their grpcPort.
  clients:
    - gateway
    - fraud-worker
  # Workload identity through cert-manager. When enabled, the chart renders one
  # Certificate per gRPC server and client, with the service's DNS names as
  # SANs, and each pod mounts its own <service>-mtls Secret instead of the
  # hand-built one above. cert-manager renews the leaf `renewBefore` expiry and
  # rewrites the Secret; the Go services pick the new files up on the next
  # handshake without a restart. The Python fraud worker reads its files once,
  # so it needs a rollout restart within the renewBefore window — see
  # docs/design-notes/phase5-cert-rotation.md. Requires cert-manager installed.
  certManager:
    enabled: false
    issuerRef:
      name: enjoythings-ca
      kind: Issuer
      group: cert-manager.io
    duration: 2160h    # 90 days
    renewBefore: 720h  # renew with 30 days left
    # Bootstrap a self-signed CA in the release namespace and an Issuer named
    # issuerRef.name backed by it, so a local cluster needs nothing beyond
    # cert-manager itself. Leave off to point issuerRef at a CA you operate.
    bootstrapCA:
      enabled: false
      duration: 87600h  # 10 years

applications:
  gateway:
    image: enjoythings/gateway:local
    replicas: 1
    httpPort: 8080
    grpcPort: null
    nodePort: 30080
    env:
      HTTP_ADDR: :8080
  saga-orchestrator:
    image: enjoythings/saga-orchestrator:local
    replicas: 1
    httpPort: 8080
    grpcPort: 9093
    env:
      HTTP_ADDR: :8080
      GRPC_ADDR: :9093
  wallet:
    image: enjoythings/wallet:local
    replicas: 1
    httpPort: 8080
    grpcPort: 9090
    env:
      HTTP_ADDR: :8080
      GRPC_ADDR: :9090
  ledger:
    image: enjoythings/ledger:local
    replicas: 1
    httpPort: 8080
    grpcPort: 9091
    env:
      HTTP_ADDR: :8080
      GRPC_ADDR: :9091
  payment-processor:
    image: enjoythings/payment-processor:local
    replicas: 1
    httpPort: 8080
    grpcPort: null
    env:
      HTTP_ADDR: :8080
  verification:
    image: enjoythings/verification:local
    replicas: 1
    httpPort: 8080
    grpcPort: 9094
    env:
      HTTP_ADDR: :8080
      GRPC_ADDR: :9094
  notification:
    image: enjoythings/notification:local
    replicas: 1
    httpPort: 8080
    grpcPort: null
    env:
      HTTP_ADDR: :8080
  stub-payment-rail:
    image: enjoythings/stub-payment-rail:local
    replicas: 1
    httpPort: 18090
    grpcPort: null
    env:
      HTTP_ADDR: :18090
  fraud-worker:
    image: enjoythings/fraud-worker:local
    replicas: 1
    httpPort: 9101
    metricsPort: 9101
    grpcPort: null
    readinessPath: /metrics
    livenessPath: /metrics
    env:
      FRAUD_METRICS_PORT: "9101"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LEDGER_GRPC_ADDR: ledger:9091
      VERIFICATION_GRPC_ADDR: verification:9094

applicationResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

hpa:
  enabled: false
  targets:
    wallet:
      minReplicas: 1
      maxReplicas: 3
      averageUtilization: 70
    ledger:
      minReplicas: 1
      maxReplicas: 3
      averageUtilization: 70
