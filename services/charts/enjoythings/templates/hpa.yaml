{{- if .Values.hpa.enabled }}
{{- range $name, $target := .Values.hpa.targets }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "enjoythings.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $target.minReplicas }}
  maxReplicas: {{ $target.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $target.averageUtilization }}
---
{{- end }}
{{- end }}
