{{- range $name, $app := .Values.applications }}
{{- $mtls := and $.Values.mtls.enabled (or $app.grpcPort (has $name $.Values.mtls.clients)) }}
{{- $mtlsPrefix := ternary "FRAUD_GRPC_TLS" "GRPC_TLS" (eq $name "fraud-worker") }}
{{- $certManager := and $mtls $.Values.mtls.certManager.enabled }}
{{- /* cert-manager Secrets hold tls.crt/tls.key; the hand-built Secret holds <service>.crt/.key. */}}
{{- $leaf := ternary "tls" $name $certManager }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "enjoythings.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $app.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "enjoythings.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: {{ default $app.httpPort $app.metricsPort | quote }}
      labels:
        {{- include "enjoythings.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: {{ $name }}
          image: {{ $app.image | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $app.httpPort }}
            {{- if and $app.metricsPort (ne (int $app.metricsPort) (int $app.httpPort)) }}
            - name: metrics
              containerPort: {{ $app.metricsPort }}
            {{- end }}
            {{- if $app.grpcPort }}
            - name: grpc
              containerPort: {{ $app.grpcPort }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "enjoythings.configName" $ }}
            - secretRef:
                name: {{ include "enjoythings.secretName" $ }}
          env:
            {{- range $key, $value := $app.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if $mtls }}
            - name: {{ $mtlsPrefix }}_ENABLED
              value: "true"
            - name: {{ $mtlsPrefix }}_CERT_FILE
              value: {{ printf "%s/%s.crt" $.Values.mtls.mountPath $leaf | quote }}
            - name: {{ $mtlsPrefix }}_KEY_FILE
              value: {{ printf "%s/%s.key" $.Values.mtls.mountPath $leaf | quote }}
            - name: {{ $mtlsPrefix }}_CA_FILE
              value: {{ printf "%s/ca.crt" $.Values.mtls.mountPath | quote }}
            {{- end }}
          {{- if $mtls }}
          volumeMounts:
            - name: mtls-certs
              mountPath: {{ $.Values.mtls.mountPath }}
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ default "/readyz" $app.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: {{ default "/healthz" $app.livenessPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml $.Values.applicationResources | nindent 12 }}
      {{- if $mtls }}
      volumes:
        - name: mtls-certs
          secret:
            secretName: {{ ternary (include "enjoythings.certSecretName" $name) $.Values.mtls.secretName $certManager }}
      {{- end }}
---
{{- end }}
