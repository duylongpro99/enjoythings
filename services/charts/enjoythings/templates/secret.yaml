{{- /*
Rendered only when secrets.create is true (the default). Set it to false when
the Secret is created out of band, for example by an operator pulling from a
vault or by hand before a GitOps sync, so values files never carry credentials.
The externally created Secret must use the same name and keys as below.
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enjoythings.secretName" . }}
  labels:
    {{- include "enjoythings.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  FRAUD_POSTGRES_PASSWORD: {{ .Values.fraudTimescaledb.password | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  FRAUD_DATABASE_URL: {{ .Values.secrets.fraudDatabaseUrl | quote }}
  LOCAL_LLM_API_KEY: {{ .Values.secrets.localLLMApiKey | quote }}
{{- end }}
